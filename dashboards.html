<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackrr | Dashboards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="static/css/main.css" />
  </head>
  <body data-page="dashboards">
    <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm px-3">
      <a class="navbar-brand fw-semibold" href="index.html">Trackrr</a>
      <nav class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
        <a class="nav-link" href="dashboards.html">Dashboards</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="signup.html">Sign Up</a>
        <button class="btn btn-sm btn-outline-secondary" data-logout-button>Logout</button>
      </nav>
    </header>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Dashboards</h1>
      </div>

      <div class="row g-3 mb-4" id="dashboard-list"></div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Create dashboard</h2>
          <form id="dashboard-form">
            <div class="mb-3">
              <label for="dashboard-name" class="form-label">Name</label>
              <input type="text" id="dashboard-name" name="name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="dashboard-description" class="form-label">Description</label>
              <textarea id="dashboard-description" name="description" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create dashboard</button>
            <div id="dashboard-form-message" class="alert mt-3" hidden></div>
          </form>
        </div>
      </div>
    </main>

    <script src="static/js/config.js"></script>
    <script src="static/js/app.js"></script>
  </body>
</html>
