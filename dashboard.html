<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackrr | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="static/css/main.css" />
  </head>
  <body data-page="dashboard-detail">
    <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm px-3">
      <a class="navbar-brand fw-semibold" href="index.html">Trackrr</a>
      <nav class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
        <a class="nav-link" href="dashboards.html">Dashboards</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="signup.html">Sign Up</a>
        <button class="btn btn-sm btn-outline-secondary" data-logout-button>Logout</button>
      </nav>
    </header>

    <main class="container-fluid py-4">
      <div id="dashboard-detail"></div>
      <div id="dashboard-detail-message" class="alert mt-3" hidden></div>

      <section class="card shadow-sm mt-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3 gap-3">
            <h2 class="h5 mb-0">Lists</h2>
            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="collapse" data-bs-target="#list-form-container" aria-expanded="false" aria-controls="list-form-container">
              Create list
            </button>
          </div>

          <div id="list-form-container" class="collapse">
            <form id="list-form">
              <div class="mb-3">
                <label for="list-name" class="form-label">List name</label>
                <input type="text" id="list-name" name="name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="list-description" class="form-label">Description</label>
                <textarea id="list-description" name="description" class="form-control" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Create list</button>
              <div id="list-form-message" class="alert mt-3" hidden></div>
            </form>
          </div>
        </div>
      </section>

      <section class="dashboard-board__columns d-flex flex-wrap gap-3 py-4" id="list-container"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/drag_and_drop.js"></script>
  </body>
</html>
