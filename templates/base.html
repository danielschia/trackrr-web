<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trackr</title>
        {{ bootstrap.load_css() }}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    </head>
    <body>
        <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm px-3">
            <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">Trackr</a>
            <nav class="navbar-nav ms-auto d-flex flex-row gap-3">
                {% if is_authenticated %}
                    <a class="nav-link" href="{{ url_for('web_dashboard.dashboards_page') }}">Dashboards</a>
                    <a class="nav-link" href="{{ url_for('web_auth.logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('web_auth.login_page') }}">Login</a>
                    <a class="nav-link" href="{{ url_for('web_auth.signup_page') }}">Sign Up</a>
                {% endif %}
            </nav>
        </header>
        <main class="flex-grow-1">
            {% block content %}{% endblock %}
        </main>
        <footer class="text-center small text-muted py-2 border-top bg-white">
            <p class="mb-0">Star this <a href="https://github.com/danielschia/trackrr" target="_blank">repository</a> on GitHub</p>
        </footer>
        {{ bootstrap.load_js() }}
    </body>
</html>
