<button type="button" class="btn btn-outline-primary btn-sm mt-2" data-bs-toggle="collapse" data-bs-target="#list-form" aria-expanded="false" aria-controls="list-form">
    Add List
</button>
<div class="collapse" id="list-form">
    <form method="POST" action="{{ url_for('web_list.create_list') }}" id="list-form" data-api-url="{{ url_for('lists_api.create_list') }}" class="card card-body">
        <input type="hidden" name="dashboard_id" value="{{ dashboard.id }}">
        <label for="list-name" class="form-label">List Name</label>
        <input type="text" id="list-name" name="name" class="form-control mb-2" required>
        <label for="list-description" class="form-label">Description</label>
        <input type="text" id="list-description" name="description" class="form-control mb-2">
        <p id="list-form-error" class="form-error text-danger small mb-2" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary btn-sm">Create List</button>
        <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="collapse" data-bs-target="#list-form" aria-expanded="false" aria-controls="list-form">
            Cancel
        </button>
    </form>
</div>
