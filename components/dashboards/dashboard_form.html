<button type="button" class="btn btn-outline-primary btn-sm mt-2" data-bs-toggle="collapse" data-bs-target="#dashboard-form" aria-expanded="false" aria-controls="dashboard-form">
    Create Dashboard
</button>
<div class="collapse" id="dashboard-form">
    <form method="POST" action="{{ url_for('web_dashboard.create_dashboard') }}">
        <label for="name" class="form-label small mb-1">Dashboard Name:</label>
        <input type="text" id="name" name="name" class="form-control form-control-sm mb-2" required>
        <label for="description" class="form-label small mb-1">Description:</label>
        <input type="text" id="description" name="description" class="form-control form-control-sm mb-2">
        <button type="submit" class="btn btn-outline-primary btn-sm">Create Dashboard</button>
        <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="collapse" data-bs-target="#dashboard-form" aria-expanded="false" aria-controls="dashboard-form">
            Cancel
        </button>
    </form>
</div>
