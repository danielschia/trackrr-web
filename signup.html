<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackrr | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="static/css/main.css" />
  </head>
  <body>
    <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm px-3">
      <a class="navbar-brand fw-semibold" href="index.html">Trackrr</a>
      <nav class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
        <a class="nav-link" href="dashboards.html">Dashboards</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="signup.html">Sign Up</a>
        <button class="btn btn-sm btn-outline-secondary" data-logout-button hidden>Logout</button>
      </nav>
    </header>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h1 class="mb-4">Sign Up</h1>
          <form id="signup-form">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" name="username" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <div id="signup-form-message" class="alert mt-3" hidden></div>
          </form>
        </div>
      </div>
    </main>

    <script src="static/js/app.js"></script>
  </body>
</html>
